services:
  postgres:
    image: postgres:15-alpine
    container_name: fcstask-db
    environment:
      POSTGRES_USER: fcstask
      POSTGRES_PASSWORD: fcstask_password
      POSTGRES_DB: fcstask-monitor-bot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fcstask -d fcstask-monitor-bot"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKERHUB_IMAGE:-fcstask-monitor-bot:latest}
    container_name: fcstask-app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
